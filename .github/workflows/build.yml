name: Build

on: [push, pull_request]

jobs:
  build-1_21_1:
    name: Minecraft 1.21.1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: modernarmory-1.21.1
          path: build/libs/*.jar

  build-26_3:
    name: Minecraft 26.3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Gradle runs on JDK 21 (the last one listed becomes JAVA_HOME); the 26.3 code compiles with a JDK 25 toolchain,
      # which Gradle finds from setup-java's JAVA_HOME_25_X64
      - name: Setup JDK 25 and 21
        uses: actions/setup-java@v4
        with:
          java-version: |
            25
            21
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        working-directory: versions/26.3
        run: ./gradlew build

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: modernarmory-26.3
          path: versions/26.3/build/libs/*.jar
