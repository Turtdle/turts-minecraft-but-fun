plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

// Assets shared with the 1.21.1 build in the repository root (lang, geo models, textures, animations).
// They are generated once (tools/modelgen) and used by both versions.
def sharedResources = file('../../src/main/resources')
def sharedResourcesPath = sharedResources.absolutePath

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')
    // Version-independent assets and data from the root project (textures, sounds, damage types, tags...).
    srcDir(sharedResources)

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("**/*.preview.png") // model generator previews
    exclude("src/generated/**/.cache") // datagen cache files

    // Root files that 26.3 can't use as-is (only applies to files from the root folder):
    //  - assets/<ns>/{geo,animations,models,lang}: converted into build/generated/sources/sharedAssets
    //    by prepareSharedAssets below.
    //  - data/<ns>/recipe: 1.21.1 recipes use {"item": ...} ingredient objects; 26.x takes plain ids.
    //    The 26.3-format copies live in versions/26.3/src/main/resources/data/<ns>/recipe.
    exclude { FileTreeElement element ->
        if (!element.file.absolutePath.startsWith(sharedResourcesPath)) return false
        def segments = element.relativePath.segments
        if (segments.length < 3) return false
        return (segments[0] == 'assets' && segments[2] in ['geo', 'animations', 'models', 'lang'])
                || (segments[0] == 'data' && segments[2] == 'recipe')
    }
}

// Converts the shared (1.21.1 / GeckoLib 4 layout) root assets for 26.3 / GeckoLib 5, so the root project
// stays the single source of truth (tools/modelgen output, hand-tuned display transforms, lang):
//  - assets/<ns>/geo/**        -> assets/<ns>/geckolib/models/**      (GeckoLib 5 location)
//  - assets/<ns>/animations/** -> assets/<ns>/geckolib/animations/**  (files without animations are skipped:
//                                 GeckoLib 5 rejects them, and modelgen writes such placeholders)
//  - assets/<ns>/models/**:
//      models/item/<item>.json with "parent": "builtin/entity" (a GeckoLib item) -> the same display transforms
//          without the removed builtin/entity parent, plus a particle texture; generated item definition
//          items/<item>.json = minecraft:special model of type geckolib:geckolib
//      models/item/<item>.json with "loader": "neoforge:separate_transforms" (base = a GeckoLib model, perspectives.gui
//          = the inventory sprite, tools/modelgen/display.py) -> the base converted as above; items/<item>.json selects
//          on the display context: GUIs draw the sprite model unless the stack has modernarmory:render_3d
//      any other model is copied; models/item/<item>.json also gets items/<item>.json = minecraft:model
//    (an items/<item>.json in versions/26.3/src/main/resources replaces the generated definition)
//  - assets/<ns>/lang/*.json   -> merged with src/main/lang-overlay/<ns>/*.json (26.3-only keys)
def generatedSharedAssets = layout.buildDirectory.dir('generated/sources/sharedAssets')
def versionResources = file('src/main/resources')
def langOverlay = file('src/main/lang-overlay')
var prepareSharedAssets = tasks.register('prepareSharedAssets') {
    def sharedAssetsDir = new File(sharedResources, 'assets')
    inputs.files(fileTree(sharedAssetsDir) { include '*/geo/**', '*/animations/**', '*/models/**', '*/lang/**' })
            .withPropertyName('sharedAssets').withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files(fileTree(langOverlay)).withPropertyName('langOverlay').withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files(fileTree(versionResources) { include 'assets/*/items/**' })
            .withPropertyName('itemDefinitionOverrides').withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.dir(generatedSharedAssets)

    doLast {
        def outRoot = generatedSharedAssets.get().asFile
        outRoot.deleteDir()
        def slurper = new groovy.json.JsonSlurper()
        def writeJson = { File f, Object json ->
            f.parentFile.mkdirs()
            f.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json)) + '\n', 'UTF-8')
        }
        def relPath = { File base, File f -> base.toPath().relativize(f.toPath()).toString().replace(File.separator, '/') }
        def copyFile = { File from, File to ->
            to.parentFile.mkdirs()
            to.bytes = from.bytes
        }

        def namespaces = new TreeSet<String>()
        (sharedAssetsDir.listFiles() ?: []).each { if (it.isDirectory()) namespaces << it.name }
        (langOverlay.listFiles() ?: []).each { if (it.isDirectory()) namespaces << it.name }

        namespaces.each { String ns ->
            def src = new File(sharedAssetsDir, ns)
            def out = new File(outRoot, "assets/${ns}")

            def geo = new File(src, 'geo')
            if (geo.isDirectory()) geo.eachFileRecurse(groovy.io.FileType.FILES) { File f ->
                copyFile(f, new File(out, "geckolib/models/${relPath(geo, f)}"))
            }

            def anims = new File(src, 'animations')
            if (anims.isDirectory()) anims.eachFileRecurse(groovy.io.FileType.FILES) { File f ->
                if (f.name.endsWith('.json')) {
                    def json = slurper.parse(f)
                    if (!(json instanceof Map) || !json.animations) return
                }
                copyFile(f, new File(out, "geckolib/animations/${relPath(anims, f)}"))
            }

            def models = new File(src, 'models')
            if (models.isDirectory()) models.eachFileRecurse(groovy.io.FileType.FILES) { File f ->
                def rel = relPath(models, f)
                def modelOut = new File(out, "models/${rel}")
                if (!rel.endsWith('.json')) {
                    copyFile(f, modelOut)
                    return
                }
                def model = slurper.parse(f)
                boolean isItem = rel.startsWith('item/') && rel.indexOf('/', 5) < 0 // item/icon/* are sprite models only
                String item = isItem ? rel.substring(5, rel.length() - 5) : null
                // a variant drawn with another item's model ({"parent": "<ns>:item/<other>"}, e.g. m4a1 -> m4) gets that
                // item's definition
                String sameAs = model instanceof Map && model.parent instanceof String && model.parent.startsWith("${ns}:item/")
                        ? model.parent.substring("${ns}:item/".length()) : null
                def drawn = sameAs ? slurper.parse(new File(models, "item/${sameAs}.json")) : model
                String drawnItem = sameAs ?: item
                // 1.21.1 "3D in hand, 2D sprite in GUIs": NeoForge's separate_transforms loader around the GeckoLib model
                boolean sprite = drawn instanceof Map && drawn.loader == 'neoforge:separate_transforms'
                def baseModel = sprite ? drawn.base : drawn
                String guiSprite = sprite ? drawn.perspectives?.gui?.parent : null
                boolean geckolib = baseModel instanceof Map && baseModel.parent in ['builtin/entity', 'minecraft:builtin/entity']
                if (geckolib && sameAs) {
                    copyFile(f, modelOut)
                } else if (geckolib) {
                    def converted = new LinkedHashMap(baseModel)
                    converted.remove('parent')
                    def textures = new LinkedHashMap(baseModel.textures ?: [:])
                    if (isItem) textures.putIfAbsent('particle', "${ns}:item/${item}".toString())
                    converted.textures = textures
                    writeJson(modelOut, converted)
                } else {
                    copyFile(f, modelOut)
                }
                if (!isItem || new File(versionResources, "assets/${ns}/items/${item}.json").exists()) return
                def definition = geckolib
                        ? [type: 'minecraft:special', base: "${ns}:item/${drawnItem}".toString(), model: [type: 'geckolib:geckolib']]
                        : [type: 'minecraft:model', model: "${ns}:item/${item}".toString()]
                if (geckolib && guiSprite) { // GUIs show the sprite, unless the stack asks for 3D (the gunsmith preview)
                    def flat = [type: 'minecraft:model', model: guiSprite]
                    def gui = [type: 'minecraft:condition', property: 'minecraft:has_component',
                               component: "${ns}:render_3d".toString(), on_true: definition, on_false: flat]
                    definition = [type: 'minecraft:select', property: 'minecraft:display_context',
                                  cases: [[when: 'gui', model: gui]], fallback: definition]
                }
                writeJson(new File(out, "items/${item}.json"), [model: definition])
            }

            def langNames = new TreeSet<String>()
            (new File(src, 'lang').listFiles() ?: []).each { if (it.name.endsWith('.json')) langNames << it.name }
            (new File(langOverlay, ns).listFiles() ?: []).each { if (it.name.endsWith('.json')) langNames << it.name }
            langNames.each { String name ->
                def merged = new LinkedHashMap()
                [new File(src, "lang/${name}"), new File(langOverlay, "${ns}/${name}")].each { File f ->
                    if (f.isFile()) merged.putAll(slurper.parse(f, 'UTF-8') as Map)
                }
                writeJson(new File(out, "lang/${name}"), merged)
            }
        }
    }
}
sourceSets.main.resources.srcDir prepareSharedAssets
neoForge.ideSyncTask prepareSharedAssets

repositories {
    // GeckoLib for 26.x is not on GeckoLib's own (cloudsmith) maven, only on Modrinth.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.3, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Scripted in-game test: makes a flat world, fires the M4, takes screenshots, quits.
        // ./gradlew runAutotest [-Pscenario=tour [-Pguns=m4,glock17]]  ->  runs/autotest/screenshots/autotest_*.png
        autotest {
            client()
            gameDirectory = project.file('runs/autotest')
            systemProperty 'modernarmory.autotest', 'true'
            // -Pscenario=core|tour, -Pguns=a,b (lazy providers: configuration-cache safe, and a changed -P value re-configures)
            systemProperties.put('modernarmory.autotest.scenario', providers.gradleProperty('scenario').orElse('core'))
            systemProperties.put('modernarmory.autotest.guns', providers.gradleProperty('guns').orElse(''))
            programArguments.addAll '--width', '1280', '--height', '720'
        }

        // Multiplayer test: joins the dedicated server started with runServer (run/ folder: offline mode, port 25599,
        // the "Dev" test player opped) and runs the "mp" scenario (client/AutoTestMultiplayer.java).
        //   start the server (./gradlew runServer), then ./gradlew runAutotestMp
        autotestMp {
            client()
            gameDirectory = project.file('runs/autotest-mp')
            systemProperty 'modernarmory.autotest', 'true'
            systemProperty 'modernarmory.autotest.scenario', 'mp'
            systemProperty 'modernarmory.autotest.server', 'localhost:25599'
            programArguments.addAll '--width', '1280', '--height', '720', '--quickPlayMultiplayer', 'localhost:25599'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // GeckoLib: animated Blockbench models for the guns (geckolib-neoforge-26.3-5.5.7.jar)
    implementation "maven.modrinth:geckolib:${geckolib_modrinth_version_id}"

    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            geckolib_version       : geckolib_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
